  spawn-deleted: "&eAviso: sem a warp spawn, /spawn e o spawn na entrada ficam indisponíveis."

spawn:
  teleported: "&aTeleportado para o spawn."
  teleported-other: "&aVocê teleportou &f{player}&a para o spawn."
  not-set: "&cO spawn ainda não foi definido. Use /setspawn."

loja:
  teleported: "&aTeleportado para a loja."

join-spawn:
  teleported: ""
  skipped-combat: "&7Você saiu em combate e voltou onde estava."

zwotp:
  usage: "&cUso: &f/zwotp <reload|info|combaton|combatoff>"
  combat-on: "&aSistema interno de combate do ZwoTeleport ativado."
  combat-off: "&aSistema interno de combate do ZwoTeleport desativado. Tags internas limpas; o plugin de combate externo fica responsável."
  combat-save-failed: "&cA alteração vale até o próximo reload, mas não foi gravada no config.yml: {reason}"
  info-header: "&8&m------&r &fZwoTeleport {version} &8&m------"
  info-line: "&7{key}: &f{value}"
